[env:esp8266]
platform = espressif8266
board = esp8266
framework = arduino
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
upload_speed = 921600

lib_deps =
    ESP8266WiFi
    ESP8266WebServer
    ArduinoJson
    Time
    Ticker

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_EXT_ROUTE_DEFAULT
